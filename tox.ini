[tox]
envlist = py{39,310,311,312,313}, py{39,310,311,312,313}-uvloop, lint, cover
skipsdist = true

[testenv]
passenv = TOXENV
commands =
    py{39,310,311,312,313}: pip install -e '.[dev,sqlite,redis,postgres]'
    py{39,310,311,312,313}-uvloop: pip install -e '.[dev,sqlite,redis,postgres,uvloop]'
    pytest .

[testenv:lint]
basepython = python3.12
commands =
    pip install -e '.[dev,sqlite,redis]'
    pylint --reports=n --rcfile=.pylintrc postfix_mta_sts_resolver

[testenv:cover]
passenv = TOXENV
basepython = python3.12
commands =
    pip install -e ".[dev,sqlite,redis,postgres]"
    pytest --cov . --cov-append --cov-report= .
    coverage report --fail-under=90 --include="postfix_mta_sts_resolver/*" --show-missing
